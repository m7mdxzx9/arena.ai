services:
  neural-forge:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - neural-forge-data:/data
    restart: unless-stopped

volumes:
  neural-forge-data:
